plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

android {
    namespace "com.kizitonwose.calendarview"
    compileSdk 33

    defaultConfig {
        minSdk 21
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.9.0"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = "com.github.afya-educon"
                artifactId = "calendarview"
                version = project.version
            }
        }
    }
}
